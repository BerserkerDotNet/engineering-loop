<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Loop execution</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./app.css" />
  </head>
  <body>
    <a class="skip-link" href="#graph">Skip to the pipeline</a>

    <header class="run-summary" id="run-summary">
      <div class="run-summary__lead">
        <button type="button" class="btn btn--ghost" id="back-button" hidden>← Back</button>
        <button type="button" class="btn btn--ghost" id="all-runs-button">All runs</button>
        <h1 id="run-title" class="run-title">Loop execution</h1>
      </div>
      <dl class="run-facts" id="run-facts" aria-label="Run summary"></dl>
    </header>

    <div class="status-bar" id="status-bar" role="status" aria-live="polite">Connecting…</div>

    <main class="layout" id="layout">
      <section class="graph-pane" aria-label="Pipeline">
        <div class="graph-toolbar" role="toolbar" aria-label="Graph controls">
          <button type="button" class="btn" id="zoom-out" aria-label="Zoom out">−</button>
          <span class="zoom-level" id="zoom-level" aria-live="off">100%</span>
          <button type="button" class="btn" id="zoom-in" aria-label="Zoom in">+</button>
          <button type="button" class="btn" id="zoom-fit">Fit graph</button>
          <label class="toggle">
            <input type="checkbox" id="toggle-attempts" />
            Expand all attempts
          </label>
        </div>

        <div class="controller-lane" id="controller-lane" aria-label="Orchestrator controller"></div>

        <div class="graph-scroll" id="graph" tabindex="0" role="application"
             aria-label="Pipeline stages. Use arrow keys to move between stages and Enter to inspect one.">
          <div class="graph-canvas" id="graph-canvas"></div>
        </div>

        <form class="runs-filter" id="runs-filter" hidden aria-label="Filter runs">
          <label>
            Skill
            <select id="runs-filter-skill">
              <option value="all">All skills</option>
            </select>
          </label>
          <label>
            Status
            <select id="runs-filter-status">
              <option value="all">All statuses</option>
              <option value="active">Active</option>
              <option value="completed">Completed</option>
              <option value="failed">Failed</option>
              <option value="canceled">Canceled</option>
            </select>
          </label>
          <label>
            Updated
            <select id="runs-filter-time">
              <option value="all">Any time</option>
              <option value="day">Past 24 hours</option>
              <option value="week">Past 7 days</option>
              <option value="month">Past 30 days</option>
            </select>
          </label>
          <output id="runs-filter-result" aria-live="polite"></output>
        </form>
        <ul class="runs-list" id="runs-list" hidden aria-label="All runs"></ul>
      </section>

      <div class="splitter" id="splitter" role="separator" aria-orientation="vertical"
           aria-label="Resize the inspector" tabindex="0"></div>

      <aside class="inspector" id="inspector" aria-label="Inspector">
        <header class="inspector__head">
          <h2 id="inspector-title">Nothing selected</h2>
          <p class="inspector__subtitle" id="inspector-subtitle">Select a stage to inspect it.</p>
        </header>

        <div class="tabs" role="tablist" aria-label="Inspector sections" id="tabs"></div>
        <div class="tab-panel" id="tab-panel" role="tabpanel" tabindex="0"></div>

        <form class="composer" id="composer" aria-label="Send a message">
          <label class="composer__label" for="composer-target">Send to</label>
          <select id="composer-target" class="composer__target" required></select>
          <label class="composer__label" for="composer-body">Message</label>
          <textarea id="composer-body" class="composer__body" rows="3"
                    placeholder="Explicitly targeted message. The exact text is delivered unchanged." required></textarea>
          <div class="composer__row">
            <button type="submit" class="btn btn--primary" id="composer-send">Send</button>
            <span class="composer__note" id="composer-note">Messages carry no approval or delivery authority.</span>
          </div>
        </form>
      </aside>
    </main>

    <button type="button" class="overlay-toggle" id="overlay-toggle" hidden aria-expanded="false">
      Inspector
    </button>

    <script type="module" src="./app.js"></script>
  </body>
</html>
